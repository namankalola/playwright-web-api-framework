name: Playwright PR Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  playwright:
    name: BookStore Regression - Chromium
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run BookStore regression
        run: npm run test:bookstore:chrome -- --grep @regression
        env:
          CI: true

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bookstore-playwright-report
          path: |
            reports/bookstore/html-report/
            reports/bookstore/junit-results.xml
            reports/bookstore/allure-results/
            reports/bookstore/test-results/
          retention-days: 14
